# Local stack: Supabase (Postgres, Auth, PostgREST, Realtime) + the Vite app, nothing to install but Docker.
#
#   docker compose up                       app on http://localhost:5173
#   docker compose --profile studio up      also Supabase Studio on http://localhost:54323
#   docker compose run --rm db-test         database test suite on a throwaway Postgres
#   docker compose down                     stop (data kept);  down -v  wipes the database
#   APP_PORT=5180 docker compose up          app on another port if 5173 is taken
#
# Local-only credentials: the JWT secret and keys below are public and must never be used elsewhere.
# Ports match the Supabase CLI (54321 API, 54322 db, 54323 Studio, 54324 mail): run one stack at a time.
name: padel-league

x-keys: &keys
  # HS256, secret = JWT_SECRET below, expiry 2100-01-01
  ANON_KEY: &anon eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzYxODY4ODAwLCJleHAiOjQxMDI0NDQ4MDB9.d4BBMK5GgAmBu_o0OwXNWd2TZVPpvlEv_7WAUy7-2Pc
  SERVICE_ROLE_KEY: &service eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3NjE4Njg4MDAsImV4cCI6NDEwMjQ0NDgwMH0.tF4ZFOsDedCLMceJ6P6qMSda5xvehLB4SniodJEQ2GU

x-env:
  jwt-secret: &jwt-secret padel-league-local-dev-jwt-secret-not-for-production
  db-password: &db-password postgres

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  image: padel-league-dev
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: *db-password
      PGPASSWORD: *db-password
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      JWT_SECRET: *jwt-secret
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    volumes:
      - ./docker/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./docker/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: ${APP_PUBLIC_URL:-http://localhost:${APP_PORT:-5173}}
      GOTRUE_URI_ALLOW_LIST: ${APP_PUBLIC_URL:-http://localhost:${APP_PORT:-5173}}/**,http://127.0.0.1:${APP_PORT:-5173}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # same default as `supabase start`: no email confirmation needed to sign in
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@padel.local
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: local
      GOTRUE_SMTP_PASS: local
      GOTRUE_SMTP_SENDER_NAME: Padel League
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: *jwt-secret
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  realtime:
    image: supabase/realtime:v2.143.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: *db-password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      METRICS_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  gateway:
    image: nginx:1.31-alpine
    restart: unless-stopped
    depends_on: [auth, rest, realtime]
    ports:
      - "54321:8000"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mail:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "54324:8025"

  # One-shot: applies pending migrations (and seed.sql on a fresh database), then exits.
  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: *db-password
      PGDATABASE: postgres
    volumes:
      - ./supabase:/supabase:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ["bash", "/migrate.sh"]
    restart: "no"

  app:
    <<: *dev-image
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-5173}:5173"
    environment:
      VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:54321}
      VITE_SUPABASE_PUBLISHABLE_KEY: *anon
      VITE_GOOGLE_LOGIN: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # One-shot: loads the demo tournament when the database has none (SEED_DEMO=force to reload).
  seed:
    <<: *dev-image
    command: ["node", "docker/seed-if-empty.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SECRET_KEY: *service
      DEMO_PASSWORD: password
      SEED_DEMO: ${SEED_DEMO:-}
    restart: "no"

  studio:
    profiles: [studio]
    image: supabase/studio:2026.10.19-sha-b375769
    restart: unless-stopped
    depends_on: [meta]
    ports:
      - "54323:3000"
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: *db-password
      PG_META_CRYPTO_KEY: padel-league-local-meta-crypto-key
      DEFAULT_ORGANIZATION_NAME: Padel League
      DEFAULT_PROJECT_NAME: local
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: *anon
      SUPABASE_SERVICE_KEY: *service
      AUTH_JWT_SECRET: *jwt-secret
      ENABLED_FEATURES_LOGS_ALL: "false"

  meta:
    profiles: [studio]
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: *db-password
      CRYPTO_KEY: padel-league-local-meta-crypto-key

  # Database tests (scripts/db-test.sh) on a throwaway plain Postgres, like CI.
  db-test:
    <<: *dev-image
    profiles: [test]
    command: ["bash", "scripts/db-test.sh"]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@test-db:5432/postgres

  test-db:
    profiles: [test]
    image: postgres:17
    command: ["postgres", "-c", "wal_level=logical", "-c", "fsync=off"]
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  db-config:
  node_modules:
