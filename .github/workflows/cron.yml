name: Cron campionato

# Sostituisce le Cloud Functions (piano Spark). Richiede il secret FIREBASE_SERVICE_ACCOUNT.
on:
  schedule:
    - cron: '17 * * * *' # ogni ora: scadenze delle richieste e ricorrenze
    - cron: '30 6 * * *' # ogni giorno: partite non giocate e promemoria email
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Task da eseguire (scadenze,ricorrenze,nonGiocate,email)'
        default: 'scadenze,ricorrenze'
      dry_run:
        description: 'Simulazione senza scritture né email'
        type: boolean
        default: false

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    if: ${{ vars.CRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Esegui
        run: node cron.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TASKS: ${{ github.event.inputs.tasks || (github.event.schedule == '30 6 * * *' && 'nonGiocate,email') || 'scadenze,ricorrenze' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          APP_URL: ${{ vars.APP_URL }}
          TZ: ${{ vars.TZ || 'Europe/Rome' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
