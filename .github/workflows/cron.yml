name: Reminder emails

# Request expiry, recurrences and unplayed matches run inside the database (pg_cron).
# Only the reminder emails run here: scripts/cron.mjs reads reminder_emails() with the
# Supabase secret key and sends them via SMTP.
# Variables: vars.SUPABASE_URL (or vars.VITE_SUPABASE_URL), vars.APP_URL, vars.CRON_ENABLED ('true' for the daily run).
# Secrets: SUPABASE_SECRET_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM.
on:
  schedule:
    - cron: '30 6 * * *' # every day (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print the emails without sending them'
        type: boolean
        default: false

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    if: ${{ vars.CRON_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Send the reminders
        run: node cron.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
