name: Demo data

# Loads or removes the demo data (scripts/seed-demo.mjs) on the hosted project.
# Users admin@, org@, gestore@, p1@…p40@ demo.it with password secrets.DEMO_PASSWORD.
# Reminder emails are never sent to @demo.it addresses.
# Settings: vars.VITE_SUPABASE_URL (or vars.SUPABASE_URL), secrets.SUPABASE_SECRET_KEY, secrets.DEMO_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [load, remove]
        default: load

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: ${{ inputs.action == 'remove' && 'Remove the demo data' || 'Load the demo data' }}
        run: node seed-demo.mjs ${{ inputs.action == 'remove' && '--remove' || '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
