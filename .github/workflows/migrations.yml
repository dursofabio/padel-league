name: Migrazioni database

# Applies supabase/migrations to the hosted Supabase project.
# Runs by hand (Actions → "Migrazioni database" → Run workflow) and on every
# push to main that changes a migration.
#
# Required settings (Settings → Secrets and variables → Actions):
#   Variables: SUPABASE_PROJECT_REF  (the project ref, e.g. from the dashboard URL)
#   Secrets:   SUPABASE_ACCESS_TOKEN (Supabase account → Access Tokens)
#              SUPABASE_DB_PASSWORD  (database password chosen when creating the project)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Carica anche i campi di esempio (supabase/seed.sql)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['supabase/migrations/**']

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Controllo configurazione
        run: |
          missing=0
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "::error::Manca la variabile SUPABASE_PROJECT_REF"; missing=1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Manca il secret SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Manca il secret SUPABASE_DB_PASSWORD"; missing=1; }
          exit $missing
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrazioni in sospeso
        run: supabase migration list
      - name: Applica le migrazioni
        run: supabase db push --yes ${{ inputs.seed && '--include-seed' || '' }}
