name: Database migrations

# Applies supabase/migrations to the hosted Supabase project.
# Runs by hand (Actions → "Database migrations" → Run workflow) and on every
# push to main that changes a migration.
#
# Required settings (Settings → Secrets and variables → Actions):
#   Variables: SUPABASE_PROJECT_REF  (the project ref, e.g. from the dashboard URL)
#   Secrets:   SUPABASE_ACCESS_TOKEN (Supabase account → Access Tokens)
#              SUPABASE_DB_PASSWORD  (database password chosen when creating the project)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Also load the sample courts (supabase/seed.sql)
        type: boolean
        default: false
      reset:
        description: >-
          AZZERA il database: cancella TUTTI i dati, utenti compresi, e riapplica da zero migrazioni e campi.
          Per confermare scrivi qui il project ref; lascia vuoto per il normale aggiornamento.
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['supabase/migrations/**']

concurrency:
  group: migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check configuration
        run: |
          missing=0
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "::error::Missing variable SUPABASE_PROJECT_REF"; missing=1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"; missing=1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Missing secret SUPABASE_DB_PASSWORD"; missing=1; }
          exit $missing
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Pending migrations
        run: supabase migration list --linked
      - name: Apply the migrations
        if: ${{ inputs.reset == '' || inputs.reset == null }}
        run: supabase db push --linked --yes ${{ inputs.seed && '--include-seed' || '' }}
      - name: Reset the database (all data and users wiped)
        if: ${{ inputs.reset != '' && inputs.reset != null }}
        env:
          CONFERMA: ${{ inputs.reset }}
        run: |
          if [ "$CONFERMA" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Conferma errata: per azzerare scrivi esattamente il project ref ($SUPABASE_PROJECT_REF)"
            exit 1
          fi
          # wipes the project data (auth users included) and migration history, re-applies every migration and supabase/seed.sql
          supabase db reset --linked --yes
