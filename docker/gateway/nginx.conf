# Local API gateway: plays the role of Kong/Envoy in hosted Supabase.
# One origin (http://localhost:54321) for auth, rest and realtime, with CORS for the Vite dev server.
# No API key check: local development only.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8000;
  client_max_body_size 10m;

  # CORS handled here once; upstream CORS headers are dropped to avoid duplicates.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, content-profile, accept-profile, prefer, range, x-client-info, x-supabase-api-version" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, content-profile, x-total-count" always;

  if ($request_method = OPTIONS) {
    return 204;
  }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # Realtime picks the tenant from the first label of the Host header ("realtime-dev", seeded by SEED_SELF_HOST).
  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.local;
    proxy_read_timeout 1h;
  }

  location = /health {
    return 200 'ok';
  }
}
